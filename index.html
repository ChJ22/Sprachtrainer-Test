<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sprachtrainer</title>
<meta name="theme-color" content="#176b60">
<link rel="stylesheet" href="styles.css?v=20261004-layout-1">
</head>
<body>
<main>
<div class="trainer">
<header class="brand-header">
<div class="brand">
<span class="brand-mark" aria-hidden="true">
<svg viewBox="0 0 32 32" fill="none">
<path d="M5 7h9a5 5 0 0 1 5 5v15a5 5 0 0 0-5-5H5V7Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
<path d="M19 12a5 5 0 0 1 5-5h3v15h-3a5 5 0 0 0-5 5M9 12h5M9 16h5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
</svg>
</span>
<h1 data-i18n="title">Sprachtrainer</h1>
</div>
<p class="test-banner">
<span data-i18n="testVersion">🧪 Konten-Testversion</span> · <a data-i18n="oldTrainer" href="https://chj22.github.io/Sprachtrainer/">Zum bisherigen Trainer</a>
</p>
</header>
<section class="utility-panel">
<label class="row interface-settings">
<span data-i18n="uiLanguage">Menü- und Basissprache</span> <select id="ui-language" aria-label="Interface language">
<option value="de">Deutsch 🇩🇪</option>
<option value="en">English 🇬🇧</option>
<option value="fr">Français 🇫🇷</option>
<option value="es">Español 🇪🇸</option>
<option value="it">Italiano 🇮🇹</option>
<option value="pl">Polski 🇵🇱</option>
</select>
</label>
<details id="account-box">
<summary id="account-label">Gast · Ergebnisse nur in dieser Runde</summary>
<form id="account-form" class="stack">
<label>
<span data-i18n="accountName">Name (optional)</span> <input id="account-name" autocomplete="nickname" maxlength="80">
</label>
<label>
<span data-i18n="accountEmail">E-Mail</span> <input id="account-email" type="email" autocomplete="username" required maxlength="254">
</label>
<label>
<span data-i18n="accountPassword">Passwort</span> <input id="account-password" type="password" autocomplete="current-password" required minlength="8" maxlength="128">
</label>
<div class="row">
<button id="account-login" data-i18n="accountLogin" class="primary" type="submit" disabled>Anmelden</button>
<button id="account-signup" data-i18n="accountSignup" type="button" disabled>Konto anlegen</button>
</div>
</form>
<div class="row">
<button id="account-sync" data-i18n="accountSync" type="button" hidden>Synchronisieren</button>
<button id="account-logout" data-i18n="accountLogout" type="button" hidden>Abmelden</button>
</div>
</details>
<p id="account-status" class="muted" role="status" aria-live="polite">
</p>
<button id="progress-open" data-i18n="progressOpen" type="button" disabled>Mein gespeicherter Lernstand</button>
<div id="progress-panel" hidden>
<h2 data-i18n="progressTitle">Mein Lernstand</h2>
<div id="progress-content">
</div>
</div>
</section>
<section class="learning-panel">
<p id="intro">Welche Sprache möchtest du mit Deutsch üben?</p>
<div id="language-screen" class="stack">
<label>
<span data-i18n="language">Sprache</span> <select id="language">
</select>
</label>
<button class="primary" id="choose-language" data-i18n="next">Weiter →</button>
</div>
<div id="menu" class="stack hidden">
<button id="language-back" data-i18n="languagesBack">← Sprachauswahl</button>
<button id="mode-words" class="mode">
<span>
<strong data-i18n="words">📚 Wörter</strong>
<small data-i18n="wordsDesc">Vokabeln üben</small>
</span>
<span>→</span>
</button>
<button id="mode-sentences" class="mode">
<span>
<strong data-i18n="sentences">💬 Sätze</strong>
<small data-i18n="sentencesDesc">Alltagssituationen üben</small>
</span>
<span>→</span>
</button>
<button id="mode-grammar" class="mode">
<span>
<strong data-i18n="grammar">✏️ Grammatik</strong>
<small data-i18n="grammarDesc">Formen verstehen und üben</small>
</span>
<span>→</span>
</button>
<button id="mode-dialogues" class="mode">
<span>
<strong data-i18n="dialogues">🗣️ Dialoge</strong>
<small data-i18n="dialoguesDesc">Unterhaltungen mit Antwortauswahl</small>
</span>
<span>→</span>
</button>
<p id="mode-message" class="muted" role="status" aria-live="polite">
</p>
</div>
<div id="setup" class="stack hidden">
<button id="setup-back" data-i18n="modesBack">← Übungsarten</button>
<label id="category-filter-label" class="hidden">
<span id="filter-title">Situation</span> <select id="category-filter">
</select>
</label>
<label id="direction-label">
<span id="direction-title" data-i18n="direction">Richtung</span> <select id="direction">
<option value="de">Deutsch → Lernsprache</option>
<option value="target">Lernsprache → Deutsch</option>
</select>
</label>
<button class="primary" id="start" data-i18n="start">Lernen starten</button>
<button id="saved-errors" data-i18n="savedErrors" type="button" hidden>Gespeicherte Fehler üben</button>
<p id="saved-errors-status" class="muted" role="status">
</p>
</div>
<div id="game" class="hidden">
<div class="row">
<button id="back" data-i18n="modesBack">← Übungsarten</button>
<span id="stats" class="muted">
</span>
</div>
<p id="category" class="muted">
</p>
<div id="dialogue-history" class="stack" hidden aria-label="Conversation">
</div>
<p id="dialogue-step" class="muted" hidden>
</p>
<h2 id="question">
</h2>
<p id="dialogue-instruction" class="muted" hidden>
</p>
<div id="answers" class="answers">
</div>
<p id="feedback" aria-live="polite">
</p>
<button id="next" data-i18n="next" class="primary hidden">Weiter →</button>
<p>
<button id="finish" data-i18n="finish">Runde beenden · Fehler ansehen</button>
</p>
</div>
<div id="review" class="hidden">
<h2 data-i18n="reviewTitle">Rundenauswertung</h2>
<p id="review-stats" aria-live="polite">
</p>
<ul id="review-list" class="stack">
</ul>
<div class="row">
<button id="repeat-mistakes" data-i18n="repeat" class="primary">Fehler wiederholen</button>
<button id="new-round" data-i18n="newRound">Neue Runde</button>
<button id="review-back" data-i18n="modesBack">← Übungsarten</button>
</div>
</div>
</section>
</div>
</main>
<script src="config.js?v=20261003-1">
</script>
<script src="languages.js?v=20260929-1">
</script>
<script src="interface.js?v=20261004-dialogues-1">
</script>
<script src="dialogues.js?v=20261004-dialogues-1">
</script>
<script src="app.js?v=20261004-dialogues-1">
</script>
<script src="account.js?v=20261004-dialogues-1">
</script>
</body>
</html>
