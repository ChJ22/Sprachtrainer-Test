<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sprachtrainer</title><style>body{font-family:system-ui,sans-serif;background:#f2f5f8;color:#18232f;margin:0}main{max-width:600px;margin:30px auto;padding:20px}.card{background:white;padding:24px;border-radius:20px;box-shadow:0 5px 22px #18232f12}h1{margin:0 0 8px}p{color:#52606e}button,select{font:inherit;padding:13px 16px;border-radius:12px;border:1px solid #cbd5e1;background:white}button{cursor:pointer}button.primary{background:#146b5a;color:white;border:0}button:disabled{opacity:.5}.stack{display:grid;gap:12px}.mode{display:flex;justify-content:space-between;align-items:center;text-align:left;gap:12px;width:100%}.mode strong{display:block}.mode small{display:block;color:#64748b;margin-top:4px}.answers{display:grid;gap:10px;margin:20px 0}.answers button{text-align:left}.right{background:#d6f5df!important}.wrong{background:#ffdddd!important}.muted{font-size:.9rem;color:#64748b}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.hidden,[hidden]{display:none!important}#review-list{padding-left:22px}#review-list li{line-height:1.5}#review-list small{color:#64748b}input{font:inherit;padding:10px;border:1px solid #cbd5e1;border-radius:10px;box-sizing:border-box;width:100%;margin-top:6px}details{border:1px solid #cbd5e1;border-radius:12px;padding:12px}summary{cursor:pointer}details form{margin-top:14px}.test-banner{background:#fff5d5;padding:10px;border-radius:10px;font-size:.9rem}a{color:#146b5a}
/* Learning takes visual priority; utility controls remain touch-friendly. */
*{box-sizing:border-box}
body{font-size:16px;line-height:1.45}
main{max-width:680px;margin:20px auto;padding:16px}
.card{padding:24px;gap:10px}
h1{font-size:1.55rem;line-height:1.2;margin-bottom:4px}
button,select,summary{min-height:44px}
button{touch-action:manipulation}
button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #368bdb;outline-offset:3px}
.interface-settings{font-size:.8rem;color:#64748b;gap:6px 12px}
#ui-language{font-size:16px;padding:8px 12px;background:#f8fafb;border-radius:10px}
.test-banner{font-size:.75rem;margin:0;padding:7px 10px;background:#f7f5ec;color:#697268}
#account-box{font-size:.85rem;padding:0 10px;background:#f8fafb;border-color:#e2e8ed;border-radius:10px}
#account-label{display:list-item;padding:10px 0;color:#52606e;overflow-wrap:anywhere}
#account-form{gap:10px;margin:0 0 12px}
#account-form input{font-size:16px;min-height:44px;padding:9px 11px}
#account-box button{font-size:.875rem;padding:8px 12px;border-radius:9px}
#account-box>.row{padding-bottom:10px}
#account-status{font-size:.78rem;margin:0;line-height:1.4}
#account-status:empty{display:none}
#progress-open{justify-self:start;font-size:.85rem;padding:8px 12px;border-color:#e2e8ed;background:#f8fafb;color:#52606e;border-radius:9px;text-align:left}
#progress-panel{background:#f8fafb;padding:12px 14px;border-radius:10px;font-size:.875rem}
#progress-panel h2{font-size:1.1rem;margin:0 0 8px}
#progress-panel h3{font-size:1rem;margin:8px 0}
#progress-panel p{margin:8px 0}
#intro{font-size:1.2rem;font-weight:650;color:#18232f;line-height:1.35;margin:16px 0 8px}
#language-screen{gap:14px}
#language-screen label{font-size:.95rem;color:#52606e;display:grid;gap:7px}
#language{width:100%;font-size:1.125rem;padding:13px 16px;font-weight:600}
#choose-language,#start{font-size:1.125rem;font-weight:650;min-height:54px}
#menu{gap:12px}
.mode{padding:16px 18px;border-color:#d7e2df;min-height:76px}
.mode strong{font-size:1.125rem;color:#18232f}
.mode small{font-size:.875rem;font-weight:400}
#language-back,#setup-back,#back,#review-back,#new-round,#finish{font-size:.85rem;padding:8px 12px;color:#52606e;background:#f8fafb;border-color:#e2e8ed}
#language-back,#setup-back{justify-self:start}
#setup label{font-size:.9rem;color:#52606e}
#setup select{font-size:16px;max-width:100%}
#saved-errors{font-size:.9rem;padding:10px 14px;border-color:#b7d5cd;color:#146b5a}
#game{padding-top:12px;border-top:1px solid #e2e8ed;margin-top:12px}
#game>.row:first-child{justify-content:space-between}
#stats,#category{font-size:.8rem}
#category{margin:18px 0 6px}
#question{font-size:clamp(1.65rem,5.5vw,2.2rem);line-height:1.3;margin:6px 0 18px;overflow-wrap:anywhere}
#question+.row button{font-size:.85rem;padding:8px 12px;color:#146b5a;background:#f3f8f6}
.answers{gap:12px;margin:20px 0}
.answers button{font-size:1.125rem;line-height:1.4;font-weight:550;padding:16px 18px;min-height:58px;border-color:#c8d9d4;border-radius:12px;overflow-wrap:anywhere}
#feedback{font-size:1rem;line-height:1.5}
#next,#repeat-mistakes{font-size:1.05rem;font-weight:650;min-height:52px;padding:12px 22px}
#game>p:last-child{margin-bottom:0}
#review h2{font-size:1.5rem}
@media(max-width:480px){main{margin:8px auto;padding:10px}.card{padding:18px;border-radius:16px}h1{font-size:1.4rem}.interface-settings{align-items:center}.mode{padding:14px 16px}#intro{font-size:1.15rem}}
</style></head><body><main><div class="card stack"><h1>🌍 <span data-i18n="title">Sprachtrainer</span></h1><label class="row interface-settings"><span data-i18n="uiLanguage">Menü- und Basissprache</span> <select id="ui-language" aria-label="Interface language"><option value="de">Deutsch 🇩🇪</option><option value="en">English 🇬🇧</option><option value="fr">Français 🇫🇷</option><option value="es">Español 🇪🇸</option><option value="it">Italiano 🇮🇹</option><option value="pl">Polski 🇵🇱</option></select></label><p class="test-banner"><span data-i18n="testVersion">🧪 Konten-Testversion</span> · <a data-i18n="oldTrainer" href="https://chj22.github.io/Sprachtrainer/">Zum bisherigen Trainer</a></p><details id="account-box"><summary id="account-label">Gast · Ergebnisse nur in dieser Runde</summary><form id="account-form" class="stack"><label><span data-i18n="accountName">Name (optional)</span> <input id="account-name" autocomplete="nickname" maxlength="80"></label><label><span data-i18n="accountEmail">E-Mail</span> <input id="account-email" type="email" autocomplete="username" required maxlength="254"></label><label><span data-i18n="accountPassword">Passwort</span> <input id="account-password" type="password" autocomplete="current-password" required minlength="8" maxlength="128"></label><div class="row"><button id="account-login" data-i18n="accountLogin" class="primary" type="submit" disabled>Anmelden</button><button id="account-signup" data-i18n="accountSignup" type="button" disabled>Konto anlegen</button></div></form><div class="row"><button id="account-sync" data-i18n="accountSync" type="button" hidden>Synchronisieren</button><button id="account-logout" data-i18n="accountLogout" type="button" hidden>Abmelden</button></div></details><p id="account-status" class="muted" role="status" aria-live="polite"></p><button id="progress-open" data-i18n="progressOpen" type="button" disabled>Mein gespeicherter Lernstand</button><div id="progress-panel" hidden><h2 data-i18n="progressTitle">Mein Lernstand</h2><div id="progress-content"></div></div><p id="intro">Welche Sprache möchtest du mit Deutsch üben?</p><div id="language-screen" class="stack"><label><span data-i18n="language">Sprache</span> <select id="language"></select></label><button class="primary" id="choose-language" data-i18n="next">Weiter →</button></div><div id="menu" class="stack hidden"><button id="language-back" data-i18n="languagesBack">← Sprachauswahl</button><button id="mode-words" class="mode"><span><strong data-i18n="words">📚 Wörter</strong><small data-i18n="wordsDesc">Vokabeln üben</small></span><span>→</span></button><button id="mode-sentences" class="mode"><span><strong data-i18n="sentences">💬 Sätze</strong><small data-i18n="sentencesDesc">Alltagssituationen üben</small></span><span>→</span></button><button id="mode-grammar" class="mode"><span><strong data-i18n="grammar">✏️ Grammatik</strong><small data-i18n="grammarDesc">Formen verstehen und üben</small></span><span>→</span></button><p id="mode-message" class="muted" role="status" aria-live="polite"></p></div><div id="setup" class="stack hidden"><button id="setup-back" data-i18n="modesBack">← Übungsarten</button><label id="category-filter-label" class="hidden"><span id="filter-title">Situation</span> <select id="category-filter"></select></label><label id="direction-label"><span data-i18n="direction">Richtung</span> <select id="direction"><option value="de">Deutsch → Lernsprache</option><option value="target">Lernsprache → Deutsch</option></select></label><button class="primary" id="start" data-i18n="start">Lernen starten</button><button id="saved-errors" data-i18n="savedErrors" type="button" hidden>Gespeicherte Fehler üben</button><p id="saved-errors-status" class="muted" role="status"></p></div><div id="game" class="hidden"><div class="row"><button id="back" data-i18n="modesBack">← Übungsarten</button><span id="stats" class="muted"></span></div><p id="category" class="muted"></p><h2 id="question"></h2><div id="answers" class="answers"></div><p id="feedback" aria-live="polite"></p><button id="next" data-i18n="next" class="primary hidden">Weiter →</button><p><button id="finish" data-i18n="finish">Runde beenden · Fehler ansehen</button></p></div><div id="review" class="hidden"><h2 data-i18n="reviewTitle">Rundenauswertung</h2><p id="review-stats" aria-live="polite"></p><ul id="review-list" class="stack"></ul><div class="row"><button id="repeat-mistakes" data-i18n="repeat" class="primary">Fehler wiederholen</button><button id="new-round" data-i18n="newRound">Neue Runde</button><button id="review-back" data-i18n="modesBack">← Übungsarten</button></div></div></div></main><script src="config.js?v=20261003-1"></script><script src="languages.js?v=20260929-1"></script><script src="interface.js?v=20261003-3"></script><script src="app.js?v=20261003-3"></script><script src="account.js?v=20261003-3"></script></body></html>
