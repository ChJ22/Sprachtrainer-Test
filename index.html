<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sprachtrainer</title><style>body{font-family:system-ui,sans-serif;background:#f2f5f8;color:#18232f;margin:0}main{max-width:600px;margin:30px auto;padding:20px}.card{background:white;padding:24px;border-radius:20px;box-shadow:0 5px 22px #18232f12}h1{margin:0 0 8px}p{color:#52606e}button,select{font:inherit;padding:13px 16px;border-radius:12px;border:1px solid #cbd5e1;background:white}button{cursor:pointer}button.primary{background:#146b5a;color:white;border:0}button:disabled{opacity:.5}.stack{display:grid;gap:12px}.mode{display:flex;justify-content:space-between;align-items:center;text-align:left;gap:12px;width:100%}.mode strong{display:block}.mode small{display:block;color:#64748b;margin-top:4px}.answers{display:grid;gap:10px;margin:20px 0}.answers button{text-align:left}.right{background:#d6f5df!important}.wrong{background:#ffdddd!important}.muted{font-size:.9rem;color:#64748b}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.hidden,[hidden]{display:none!important}#review-list{padding-left:22px}#review-list li{line-height:1.5}#review-list small{color:#64748b}input{font:inherit;padding:10px;border:1px solid #cbd5e1;border-radius:10px;box-sizing:border-box;width:100%;margin-top:6px}details{border:1px solid #cbd5e1;border-radius:12px;padding:12px}summary{cursor:pointer}details form{margin-top:14px}.test-banner{background:#fff5d5;padding:10px;border-radius:10px;font-size:.9rem}a{color:#146b5a}</style></head><body><main><div class="card stack"><h1>🌍 <span data-i18n="title">Sprachtrainer</span></h1><label class="row"><span data-i18n="uiLanguage">Menü- und Basissprache</span> <select id="ui-language" aria-label="Interface language"><option value="de">Deutsch 🇩🇪</option><option value="en">English 🇬🇧</option><option value="fr">Français 🇫🇷</option><option value="es">Español 🇪🇸</option><option value="it">Italiano 🇮🇹</option><option value="pl">Polski 🇵🇱</option></select></label><p class="test-banner">🧪 Konten-Testversion · <a href="https://chj22.github.io/Sprachtrainer/">Zum bisherigen Trainer</a></p><details id="account-box"><summary id="account-label">Gast · Ergebnisse nur in dieser Runde</summary><form id="account-form" class="stack"><label>Name (optional) <input id="account-name" autocomplete="nickname" maxlength="80"></label><label>E-Mail <input id="account-email" type="email" autocomplete="username" required maxlength="254"></label><label>Passwort <input id="account-password" type="password" autocomplete="current-password" required minlength="8" maxlength="128"></label><div class="row"><button id="account-login" class="primary" type="submit" disabled>Anmelden</button><button id="account-signup" type="button" disabled>Konto anlegen</button></div></form><div class="row"><button id="account-sync" type="button" hidden>Synchronisieren</button><button id="account-logout" type="button" hidden>Abmelden</button></div></details><p id="account-status" class="muted" role="status" aria-live="polite"></p><button id="progress-open" type="button" disabled>Mein gespeicherter Lernstand</button><div id="progress-panel" hidden><h2>Mein Lernstand</h2><div id="progress-content"></div></div><p id="intro">Welche Sprache möchtest du mit Deutsch üben?</p><div id="language-screen" class="stack"><label><span data-i18n="language">Sprache</span> <select id="language"></select></label><button class="primary" id="choose-language" data-i18n="next">Weiter →</button></div><div id="menu" class="stack hidden"><button id="language-back" data-i18n="languagesBack">← Sprachauswahl</button><button id="mode-words" class="mode"><span><strong data-i18n="words">📚 Wörter</strong><small data-i18n="wordsDesc">Vokabeln üben</small></span><span>→</span></button><button id="mode-sentences" class="mode"><span><strong data-i18n="sentences">💬 Sätze</strong><small data-i18n="sentencesDesc">Alltagssituationen üben</small></span><span>→</span></button><button id="mode-grammar" class="mode"><span><strong data-i18n="grammar">✏️ Grammatik</strong><small data-i18n="grammarDesc">Formen verstehen und üben</small></span><span>→</span></button><p id="mode-message" class="muted" role="status" aria-live="polite"></p></div><div id="setup" class="stack hidden"><button id="setup-back" data-i18n="modesBack">← Übungsarten</button><label id="category-filter-label" class="hidden"><span id="filter-title">Situation</span> <select id="category-filter"></select></label><label id="direction-label"><span data-i18n="direction">Richtung</span> <select id="direction"><option value="de">Deutsch → Lernsprache</option><option value="target">Lernsprache → Deutsch</option></select></label><button class="primary" id="start" data-i18n="start">Lernen starten</button><button id="saved-errors" type="button" hidden>Gespeicherte Fehler üben</button><p id="saved-errors-status" class="muted" role="status"></p></div><div id="game" class="hidden"><div class="row"><button id="back" data-i18n="modesBack">← Übungsarten</button><span id="stats" class="muted"></span></div><p id="category" class="muted"></p><h2 id="question"></h2><div id="answers" class="answers"></div><p id="feedback" aria-live="polite"></p><button id="next" data-i18n="next" class="primary hidden">Weiter →</button><p><button id="finish" data-i18n="finish">Runde beenden · Fehler ansehen</button></p></div><div id="review" class="hidden"><h2 data-i18n="reviewTitle">Rundenauswertung</h2><p id="review-stats" aria-live="polite"></p><ul id="review-list" class="stack"></ul><div class="row"><button id="repeat-mistakes" data-i18n="repeat" class="primary">Fehler wiederholen</button><button id="new-round" data-i18n="newRound">Neue Runde</button><button id="review-back" data-i18n="modesBack">← Übungsarten</button></div></div></div></main><script src="config.js?v=20261003-1"></script><script src="languages.js?v=20260929-1"></script><script src="interface.js?v=20261002-3"></script><script src="app.js?v=20261003-2"></script><script src="account.js?v=20261003-2"></script></body></html>
